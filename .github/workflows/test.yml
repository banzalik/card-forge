name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python deps
        run: pip install jsonschema segno pdf417gen python-barcode
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Web build + JS/Python parity
        run: |
          cd web && npm ci && npm run build && cd ..
          node tests/test_web_parity.mjs
